const LIB = {tab:'all',q:'',subject:'all',source:'all',format:'all',programme:'all',batch:'all',view:'grid'};
const FAVOURITES = new Set([1,4,7]);

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function unique(list){return [...new Set(list)].sort((a,b)=>a.localeCompare(b));}
function optionList(values,current,allLabel){return `<option value="all">${allLabel}</option>`+values.map(v=>`<option value="${esc(v)}" ${current===v?'selected':''}>${esc(v)}</option>`).join('');}
function baseLibrary(){
  if(ROLE==='student') return MATERIALS.filter(m=>m.status==='Published'&&m.batches.includes('NITTE 1st Batch 2025-26'));
  if(ROLE==='instructor') return MATERIALS.filter(m=>m.programmes.includes('CPL Ground School'));
  return MATERIALS;
}
function filteredLibrary(){
  let rows=baseLibrary();
  const q=LIB.q.trim().toLowerCase();
  if(LIB.tab==='saved') rows=rows.filter(m=>FAVOURITES.has(m.id));
  if(q) rows=rows.filter(m=>[m.title,m.type,m.subject,m.module,m.chapter,m.topic,m.source,m.format].join(' ').toLowerCase().includes(q));
  if(LIB.subject!=='all') rows=rows.filter(m=>m.subject===LIB.subject);
  if(LIB.source!=='all') rows=rows.filter(m=>m.source===LIB.source);
  if(LIB.format!=='all') rows=rows.filter(m=>m.format===LIB.format);
  if(LIB.programme!=='all') rows=rows.filter(m=>m.programmes.includes(LIB.programme));
  if(LIB.batch!=='all') rows=rows.filter(m=>m.batches.includes(LIB.batch));
  return rows;
}
function hierarchyText(m){return [m.subject,m.module,m.chapter,m.topic].filter(Boolean).join(' › ');}
function statusChip(m){
  if(ROLE==='student') return '';
  const cls=m.status==='Published'?'st-ok':m.status==='Review'?'st-warn':'st-idle';
  return `<span class="st ${cls}">${m.status==='Published'?I.check:m.status==='Review'?I.clockSm:I.minus} ${esc(m.status)}</span>`;
}
function libraryHero(){
  const rows=baseLibrary(), saved=rows.filter(m=>FAVOURITES.has(m.id)).length;
  let eyebrow='Academy knowledge hub',title='One trusted home for learning material',copy='Organise learning resources around the real curriculum, control access by programme and batch, and keep every source easy to find.';
  let stats=[[''+rows.length,'Materials'],[''+unique(rows.map(m=>m.source)).length,'Sources'],[''+rows.filter(m=>m.status!=='Published').length,'Needs review']];
  if(ROLE==='instructor'){
    eyebrow='Instructor library'; title='Teach with the right resource, right when it matters'; copy='Find material by curriculum position, share it with your batches, or add your own supporting resource for academy review.';
    stats=[[''+rows.length,'Available'],['5','Shared by you'],['2','Batches']];
  } else if(ROLE==='student'){
    const active=rows.filter(m=>m.progress>0&&m.progress<100).length,complete=rows.filter(m=>m.progress===100).length;
    eyebrow='Your learning library'; title='Pick up exactly where you left off'; copy='Everything released to NITTE 1st Batch—organised by subject, chapter and topic, with your progress saved as you learn.';
    stats=[[''+active,'In progress'],[''+complete,'Completed'],[''+saved,'Bookmarked']];
  }
  return `<section class="lib-hero"><div class="lib-hero-in"><div><div class="lib-eyebrow">${eyebrow}</div><h2>${title}</h2><p>${copy}</p></div><div class="lib-hero-stats">${stats.map(s=>`<div class="lib-stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></div></section>`;
}
function libraryView(){
  const rows=baseLibrary();
  const subjects=unique(rows.map(m=>m.subject)),sources=unique(rows.map(m=>m.source)),formats=unique(rows.map(m=>m.format));
  const programmes=['CPL Ground School','Cabin Crew'],batches=['NITTE 1st Batch 2025-26','Nitte 2nd Batch 26-27','Cabin Crew Batch 03'];
  const roleCopy=ROLE==='admin'?'Curate, assign and govern every academy learning resource.':ROLE==='instructor'?'Find, share and add resources for the cadets you teach.':'Study material released to NITTE 1st Batch 2025–26.';
  const staff=ROLE!=='student';
  return `<div class="lib-shell">
    <div class="phead lib-phead"><div><h1>Library</h1><div class="sub">${roleCopy}</div></div><div class="lib-actions">
      ${ROLE==='student'?`<button class="btn btn-ghost" onclick="setLibraryTab('saved')">${I.bookmark} My bookmarks</button>`:''}
      ${staff?`<button class="btn btn-primary" onclick="openUploadModal()">${I.upload} Add material</button>`:''}
    </div></div>
    ${libraryHero()}
    <div class="lib-tabs" role="tablist" aria-label="Library sections">
      ${[['all','All materials',rows.length],['subjects','Subjects',subjects.length],['sources','Sources',sources.length],['saved','Saved',rows.filter(m=>FAVOURITES.has(m.id)).length]].map(t=>`<button role="tab" aria-selected="${LIB.tab===t[0]}" class="${LIB.tab===t[0]?'on':''}" data-lib-tab="${t[0]}" onclick="setLibraryTab('${t[0]}')">${t[1]} <span class="tab-count">${t[2]}</span></button>`).join('')}
    </div>
    <div class="lib-tools">
      <div class="lib-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"/></svg><input id="libSearch" type="search" value="${esc(LIB.q)}" placeholder="Search title, chapter, topic or source…" oninput="setLibQuery(this.value)" aria-label="Search library"></div>
      <select class="sel" aria-label="Filter by subject" onchange="setLibFilter('subject',this.value)">${optionList(subjects,LIB.subject,'All subjects')}</select>
      <select class="sel" aria-label="Filter by source" onchange="setLibFilter('source',this.value)">${optionList(sources,LIB.source,'All sources')}</select>
      <select class="sel" aria-label="Filter by format" onchange="setLibFilter('format',this.value)">${optionList(formats,LIB.format,'All formats')}</select>
      ${staff?`<select class="sel" aria-label="Filter by programme" onchange="setLibFilter('programme',this.value)">${optionList(programmes,LIB.programme,'All programmes')}</select><select class="sel" aria-label="Filter by batch" onchange="setLibFilter('batch',this.value)">${optionList(batches,LIB.batch,'All batches')}</select>`:`<span class="lib-filter-note">Showing material assigned to your batch</span>`}
      <button class="reset" onclick="resetLibraryFilters()">Reset</button>
      <div class="lib-view-toggle" role="group" aria-label="Material view"><button class="${LIB.view==='grid'?'on':''}" title="Grid view" onclick="setLibraryView('grid')">${I.gridView}</button><button class="${LIB.view==='list'?'on':''}" title="List view" onclick="setLibraryView('list')">${I.listView}</button></div>
    </div>
    <div id="libraryDynamic">${libraryDynamic()}</div>
  </div>`;
}
function browseBlock(kind){
  const rows=baseLibrary();
  const key=kind==='subjects'?'subject':'source';
  const values=unique(rows.map(m=>m[key]));
  const shown=LIB.tab==='all'?values.slice(0,4):values;
  const title=kind==='subjects'?(LIB.tab==='all'?'Explore the curriculum':'Browse by subject'):'Browse by source';
  const copy=kind==='subjects'?'Subject → Module (optional) → Chapter → Topic':'Reference and textbook tags used across the academy';
  return `<section class="browse-block"><div class="section-line"><div><h3>${title}</h3><p>${copy}</p></div>${LIB.tab==='all'?`<button class="link" onclick="setLibraryTab('subjects')">View every subject ${I.arrow}</button>`:''}</div><div class="browse-grid">${shown.map((v,i)=>{
    const count=rows.filter(m=>m[key]===v).length;
    const colours=['#FDF1F1','#FFF3D8','#EAF5EE','#F5EBE4'];
    return `<button class="browse-card" onclick="browseLibrary('${key}','${esc(v).replace(/'/g,'&#039;')}')"><span class="bc-ic" style="background:${colours[i%4]};color:${i%4===0?'#E31E24':i%4===1?'#A66D00':i%4===2?'#0F7A45':'#7A4A2B'}">${kind==='subjects'?I.book:I.tag}</span><b>${esc(v)}</b><span>${count} material${count===1?'':'s'}</span><i class="bc-arrow">${I.arrow}</i></button>`;
  }).join('')}</div></section>`;
}
function featuredPdfBlock(){
  const books=baseLibrary().filter(m=>m.featured&&m.pdf);
  if(!books.length)return '';
  return `<section class="featured-books"><div class="section-line"><div><h3>Full textbooks</h3><p>Two complete source books - open in your browser's searchable PDF reader</p></div><span class="st st-ok">${I.check} Files available</span></div><div class="featured-grid">${books.map(m=>`<article class="featured-book"><div class="featured-cover"><img src="${esc(m.cover)}" alt="Cover of ${esc(m.title)}"></div><div class="featured-info"><span class="full-pdf-label">${I.pdf} Full PDF</span><h4>${esc(m.title)}</h4><div class="fi-path">${esc(m.subject)} · Source: ${esc(m.source)}</div><div class="fi-meta"><span>${esc(m.pages)}</span><span>·</span><span>${esc(m.fileSize)}</span></div><a class="btn btn-primary btn-sm" href="${esc(m.pdf)}" target="_blank" rel="noopener" onclick="toast('Opening full PDF','${esc(m.title)}')">${I.book} Open full PDF</a></div></article>`).join('')}</div></section>`;
}
function materialCard(m){
  const saved=FAVOURITES.has(m.id), newItem=['30 Jul 2026','29 Jul 2026','31 Jul 2026'].includes(m.date);
  const progress=ROLE==='student'?`<div class="progress-mini"><div class="pm-line"><span>${m.progress===100?'Completed':m.progress?`Reading · ${m.progress}%`:'Not started'}</span><b>${m.progress}%</b></div><div class="bar"><i style="width:${m.progress}%;background:${m.progress===100?'var(--ok)':'var(--brand)'}"></i></div></div>`:'';
  return `<article class="material-card">
    <div class="material-cover ${m.cover?'has-image':''}" data-tone="${m.tone}">${m.cover?`<img class="material-cover-image" src="${esc(m.cover)}" alt="">`:''}<span class="format-badge">${m.pdf?I.book:m.format==='Video'?I.play:I.pdf} ${m.pdf?'Full PDF':esc(m.format)}</span>${newItem?'<span class="new-badge">NEW</span>':''}<button class="bookmark ${saved?'on':''}" onclick="toggleFavourite(${m.id},this)" title="${saved?'Remove bookmark':'Bookmark'}" aria-label="${saved?'Remove bookmark':'Bookmark'}">${I.bookmark}</button></div>
    <div class="material-body"><div><span class="source-chip">${I.tag} ${esc(m.source)}</span><h4 class="material-title">${esc(m.title)}</h4></div><div class="hierarchy">${esc(hierarchyText(m))}</div>${progress}
      <div class="material-meta"><span>${I.book} ${esc(m.type)}</span><span>${I.clockSm} ${esc(m.pages)}</span>${m.fileSize?`<span>${esc(m.fileSize)}</span>`:''}<span>${esc(m.date)}</span>${statusChip(m)}</div>
      <div class="material-foot">${m.pdf?`<a class="btn btn-primary btn-sm" href="${esc(m.pdf)}" target="_blank" rel="noopener" onclick="toast('Opening full PDF','${esc(m.title)}')">${I.book} Open PDF</a><button class="btn btn-ghost btn-sm" onclick="openReader(${m.id})" aria-label="View details">${I.eye}</button>`:`<button class="btn btn-ghost btn-sm" onclick="openReader(${m.id})">${I.eye} Preview</button>`}</div>
    </div></article>`;
}
function libraryDynamic(){
  const rows=filteredLibrary();
  const browse=LIB.tab==='sources'?browseBlock('sources'):LIB.tab==='subjects'?browseBlock('subjects'):LIB.tab==='all'?browseBlock('subjects'):'';
  const showFeatured=LIB.tab==='all'&&!LIB.q&&[LIB.subject,LIB.source,LIB.format,LIB.programme,LIB.batch].every(v=>v==='all');
  const heading=LIB.tab==='saved'?'Saved for later':LIB.tab==='sources'&&LIB.source!=='all'?LIB.source:LIB.tab==='subjects'&&LIB.subject!=='all'?LIB.subject:'Available material';
  const active=[LIB.subject,LIB.source,LIB.format,LIB.programme,LIB.batch].filter(v=>v!=='all').length+(LIB.q?1:0);
  const result=rows.length?`<div class="material-head"><div><h3>${esc(heading)}</h3><div class="count">${rows.length} result${rows.length===1?'':'s'}${active?` · ${active} filter${active===1?'':'s'} applied`:''}</div></div></div><div class="${LIB.view==='grid'?'material-grid':'material-list'}">${rows.map(materialCard).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">${LIB.tab==='saved'?I.bookmark:I.book}</div><h3>${LIB.tab==='saved'?'Nothing bookmarked yet':'No material matches'}</h3><p>${LIB.tab==='saved'?'Use the bookmark on any material to build a personal reading list.':'Try a broader search or clear one of the active filters.'}</p><button class="btn btn-ghost" onclick="resetLibraryFilters()">${LIB.tab==='saved'?'Browse all material':'Clear filters'}</button></div>`;
  return `<div class="stack">${showFeatured?featuredPdfBlock():''}${browse}${result}</div>`;
}
function refreshLibraryDynamic(){
  const el=document.getElementById('libraryDynamic'); if(el) el.innerHTML=libraryDynamic();
  const top=document.getElementById('globalSearch'); if(top&&PAGE==='library') top.value=LIB.q;
}
function setLibQuery(v){LIB.q=v;refreshLibraryDynamic();}
function setLibFilter(k,v){LIB[k]=v;refreshLibraryDynamic();}
function setLibraryView(v){LIB.view=v;document.querySelectorAll('.lib-view-toggle button').forEach((b,i)=>b.classList.toggle('on',(i===0&&v==='grid')||(i===1&&v==='list')));refreshLibraryDynamic();}
function setLibraryTab(tab){LIB.tab=tab;document.querySelectorAll('[data-lib-tab]').forEach(b=>{const on=b.dataset.libTab===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});refreshLibraryDynamic();}
function browseLibrary(k,v){LIB.tab=k==='subject'?'subjects':'sources';LIB[k]=v;document.querySelectorAll('[data-lib-tab]').forEach(b=>b.classList.toggle('on',b.dataset.libTab===LIB.tab));refreshLibraryDynamic();}
function resetLibraryFilters(){Object.assign(LIB,{q:'',subject:'all',source:'all',format:'all',programme:'all',batch:'all'});if(LIB.tab==='saved')LIB.tab='all';renderCurrentView(false);}
function toggleFavourite(id,btn){
  if(FAVOURITES.has(id)){FAVOURITES.delete(id);toast('Removed from bookmarks','You can add it again at any time.');}else{FAVOURITES.add(id);toast('Saved to your library','Find it anytime under Saved.');}
  if(LIB.tab==='saved') refreshLibraryDynamic(); else if(btn){btn.classList.toggle('on');btn.title=FAVOURITES.has(id)?'Remove bookmark':'Bookmark';}
}
function openReader(id){
  const m=MATERIALS.find(x=>x.id===id); if(!m)return;
  const path=[['Subject',m.subject],['Module',m.module],['Chapter',m.chapter],['Topic',m.topic]].filter(x=>x[1]);
  const staff=ROLE!=='student';
  const progress=ROLE==='student'?`<div class="detail-card"><h4>Your reading state</h4><div class="pm-line" style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px"><span>${m.progress===100?'Completed':m.progress?`${m.progress}% complete`:'Not started'}</span><b>${m.progress}%</b></div><div class="bar thick"><i style="width:${m.progress}%;background:${m.progress===100?'var(--ok)':'var(--brand)'}"></i></div></div>`:'';
  const overlay=document.createElement('div'); overlay.className='lib-overlay';overlay.id='readerOverlay';overlay.onclick=e=>{if(e.target===overlay)closeReader()};
  overlay.innerHTML=`<aside class="reader-drawer" role="dialog" aria-modal="true" aria-label="Material preview"><div class="reader-top"><span class="format-badge">${m.pdf?I.book:m.format==='Video'?I.play:I.pdf} ${m.pdf?'Full PDF':esc(m.format)}</span><span style="font-size:11px;color:var(--text-3)">${esc(m.source)}</span><button class="close" onclick="closeReader()" aria-label="Close preview">${I.close}</button></div><div class="reader-content"><span class="source-chip">${I.tag} ${esc(m.source)}</span><h2 class="reader-title">${esc(m.title)}</h2><p style="font-size:12px;color:var(--text-2);margin-top:8px;max-width:64ch">${esc(m.desc)}</p><div class="reader-grid"><div><div class="paper-preview">${m.cover?`<img src="${esc(m.cover)}" alt="Cover of ${esc(m.title)}" style="width:100%;max-height:360px;object-fit:contain;border-radius:8px;margin-bottom:16px">`:''}<h4>${esc(m.chapter)}</h4><p>${esc(m.desc)}</p>${m.pdf?'':`<div class="preview-diagram"></div><p>This preview shows the first section of the learning material. Key definitions, worked examples and instructor notes are presented in a focused reading layout.</p>`}<p><b>Learning objective:</b> explain the concept clearly and apply it to a typical examination or flight-planning scenario.</p></div><div class="reader-actions">${m.pdf?`<a class="btn btn-primary" href="${esc(m.pdf)}" target="_blank" rel="noopener" onclick="toast('Opening full PDF','${esc(m.title)}')">${I.book} Open full PDF · ${esc(m.fileSize)}</a>`:`<button class="btn btn-primary" onclick="readerAction(${m.id})">${m.format==='Video'?I.play:I.book} ${ROLE==='student'?(m.progress?'Continue learning':'Start learning'):'Open material'}</button>`}<button class="btn btn-ghost" onclick="toggleFavourite(${m.id});closeReader();openReader(${m.id})">${I.bookmark} ${FAVOURITES.has(m.id)?'Bookmarked':'Bookmark'}</button>${ROLE==='student'&&m.progress<100?`<button class="btn btn-ghost" onclick="markComplete(${m.id})">${I.check} Mark complete</button>`:''}</div></div><div class="reader-side"><div class="detail-card"><h4>Curriculum location</h4>${path.map(x=>`<div class="path-step"><span style="display:block;font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3)">${x[0]}</span>${esc(x[1])}</div>`).join('')}</div><div class="detail-card"><h4>Material details</h4><div class="kv"><span>Type</span><b>${esc(m.type)}</b></div><div class="kv"><span>Length</span><b>${esc(m.pages)}</b></div>${m.fileSize?`<div class="kv"><span>File size</span><b>${esc(m.fileSize)}</b></div>`:''}<div class="kv"><span>Added</span><b>${esc(m.date)}</b></div>${staff?`<div class="kv"><span>Status</span><b>${esc(m.status)}</b></div>`:''}</div>${progress}<div class="detail-card"><h4>Available to</h4><div class="tag-row">${m.programmes.map(x=>`<span class="access-tag">${esc(x)}</span>`).join('')}${m.batches.map(x=>`<span class="access-tag">${esc(x)}</span>`).join('')}</div>${staff?`<button class="mini-btn" style="margin-top:10px" onclick="openAccessModal(${m.id})">Manage access</button>`:''}</div></div></div></div></aside>`;
  document.body.appendChild(overlay);document.body.style.overflow='hidden';setTimeout(()=>overlay.querySelector('.close').focus(),30);
}
function closeReader(){document.getElementById('readerOverlay')?.remove();document.body.style.overflow='';}
function readerAction(id){const m=MATERIALS.find(x=>x.id===id);if(ROLE==='student'){m.progress=Math.max(m.progress,Math.min(95,m.progress+18||18));toast(m.progress>18?'Progress saved':'Learning started',`${m.progress}% complete · your place is saved.`);closeReader();refreshLibraryDynamic();}else toast('Material opened',`${m.title} is ready in the reader.`);}
function markComplete(id){const m=MATERIALS.find(x=>x.id===id);m.progress=100;closeReader();refreshLibraryDynamic();toast('Marked as complete','Excellent—your learning progress is up to date.');}
function openUploadModal(){
  closeReader();
  const programmes=['CPL Ground School','Cabin Crew'],batches=['NITTE 1st Batch 2025-26','Nitte 2nd Batch 26-27','Cabin Crew Batch 03'];
  const sources=['CAE Oxford','RK Bali','IC Joshi','Keith Williams','FAA','Sahil Khurana','YouTube','Aerodynamiks'];
  const subjects=unique(MATERIALS.map(m=>m.subject));
  const wrap=document.createElement('div');wrap.className='lib-modal-wrap';wrap.id='libraryModal';wrap.onclick=e=>{if(e.target===wrap)closeLibraryModal()};
  wrap.innerHTML=`<form class="lib-modal" onsubmit="addLibraryMaterial(event)"><div class="modal-head"><div><h3>Add learning material</h3><div style="font-size:10px;color:var(--text-3);margin-top:2px">Upload, describe and assign it in one step</div></div><button type="button" class="close" onclick="closeLibraryModal()" aria-label="Close">${I.close}</button></div><div class="modal-body"><label class="upload-drop"><input id="materialFile" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,video/*" hidden onchange="document.getElementById('fileLabel').textContent=this.files[0]?.name||'Choose a file or drop it here'"><span style="color:var(--brand);margin-bottom:6px">${I.upload}</span><b id="fileLabel">Choose a file or drop it here</b><span>PDF, slides, document or video · prototype stores sample metadata only</span></label><div class="form-grid"><div class="field full"><label>Material title</label><input name="title" required placeholder="e.g. Radio Navigation Revision Pack"></div><div class="field"><label>Format</label><select name="format"><option>PDF</option><option>Slides</option><option>Video</option><option>Web</option><option>Quiz</option></select></div><div class="field"><label>Source tag</label><select name="source">${sources.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Subject</label><select name="subject">${subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Module <span style="text-transform:none;font-weight:500">(optional)</span></label><input name="module" placeholder="e.g. Radio Navigation"></div><div class="field"><label>Chapter</label><input name="chapter" required placeholder="e.g. VOR & DME"></div><div class="field"><label>Topic</label><input name="topic" required placeholder="e.g. Radial interception"></div><div class="field"><label>Programme</label><select name="programme">${programmes.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Batch assignment</label><select name="batch">${batches.map(x=>`<option>${esc(x)}</option>`).join('')}</select><span class="field-help">Students only see published material assigned to their batch.</span></div><div class="field"><label>Visibility</label><select name="status"><option>Published</option><option>Draft</option><option>Review</option></select></div><div class="field"><label>Length</label><input name="pages" placeholder="e.g. 24 pages"></div><div class="field full"><label>Description</label><textarea name="desc" placeholder="What will cadets learn from this material?"></textarea></div></div></div><div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeLibraryModal()">Cancel</button><button class="btn btn-primary" type="submit">${I.upload} Add material</button></div></form>`;
  document.body.appendChild(wrap);document.body.style.overflow='hidden';setTimeout(()=>wrap.querySelector('[name=title]').focus(),30);
}
function addLibraryMaterial(e){
  e.preventDefault();const f=new FormData(e.currentTarget),id=Math.max(...MATERIALS.map(m=>m.id))+1;
  MATERIALS.unshift({id,title:f.get('title'),type:'Learning material',format:f.get('format'),subject:f.get('subject'),module:f.get('module'),chapter:f.get('chapter'),topic:f.get('topic'),source:f.get('source'),pages:f.get('pages')||'New resource',date:TODAY,tone:'gold',programmes:[f.get('programme')],batches:[f.get('batch')],status:f.get('status'),progress:0,desc:f.get('desc')||'New academy learning material.'});
  closeLibraryModal();LIB.tab='all';resetLibraryFilters();toast('Material added',`${f.get('title')} is ${String(f.get('status')).toLowerCase()} and assigned.`);
}
function closeLibraryModal(){document.getElementById('libraryModal')?.remove();document.body.style.overflow='';}
function openAccessModal(id){
  const m=MATERIALS.find(x=>x.id===id);closeReader();
  const programmes=unique(MATERIALS.flatMap(x=>x.programmes)),batches=unique(MATERIALS.flatMap(x=>x.batches));
  const wrap=document.createElement('div');wrap.className='lib-modal-wrap';wrap.id='libraryModal';wrap.onclick=e=>{if(e.target===wrap)closeLibraryModal()};
  wrap.innerHTML=`<form class="lib-modal" style="max-width:540px" onsubmit="saveAccess(event,${id})"><div class="modal-head"><div><h3>Visibility & assignment</h3><div style="font-size:10px;color:var(--text-3);margin-top:2px">${esc(m.title)}</div></div><button type="button" class="close" onclick="closeLibraryModal()">${I.close}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Programme</label><select name="programme">${programmes.map(x=>`<option ${m.programmes.includes(x)?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Batch</label><select name="batch">${batches.map(x=>`<option ${m.batches.includes(x)?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label>Visibility</label><select name="status">${['Published','Draft','Review'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select><span class="field-help">Published material becomes visible to students in the assigned batch.</span></div></div></div><div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeLibraryModal()">Cancel</button><button class="btn btn-primary">Save access</button></div></form>`;
  document.body.appendChild(wrap);document.body.style.overflow='hidden';
}
function saveAccess(e,id){e.preventDefault();const f=new FormData(e.currentTarget),m=MATERIALS.find(x=>x.id===id);m.programmes=[f.get('programme')];m.batches=[f.get('batch')];m.status=f.get('status');closeLibraryModal();refreshLibraryDynamic();toast('Access updated',`${m.status} · ${m.batches[0]}`);}

/* =====================================================================
   BEHAVIOUR
   ===================================================================== */
let ROLE='admin', PAGE='dashboard';
function setRole(r){
  ROLE=r;
  ['admin','instructor','student'].forEach(x=>document.getElementById('rb-'+x).classList.toggle('on',x===r));
  renderNav(r);
  renderCurrentView(true);
}
function openPage(name){
  if(name==='Dashboard'){PAGE='dashboard';renderNav(ROLE);renderCurrentView(true);return;}
  if(name==='Library'){PAGE='library';renderNav(ROLE);renderCurrentView(true);return;}
  toast(`${name} is mapped`, 'This interim demo focuses on the dashboard and complete Library workflow.');
}
function renderCurrentView(animate=true){
  const v=document.getElementById('view');
  const draw=()=>{
    if(PAGE==='library') v.innerHTML=libraryView();
    else v.innerHTML=ROLE==='admin'?adminView():ROLE==='instructor'?instructorView():studentView();
    if(PAGE==='dashboard'&&ROLE==='instructor') applyStudentFilter();
    document.getElementById('pageTitle').textContent=PAGE==='library'?'Library':'Dashboard';
    const gs=document.getElementById('globalSearch');
    gs.placeholder=PAGE==='library'?'Search the library…':'Search cadets, chapters, reports…';
    gs.value=PAGE==='library'?LIB.q:'';
    v.style.transition='opacity .2s ease';v.style.opacity=1;
    if(animate)window.scrollTo({top:0,behavior:'smooth'});
  };
  if(!animate){v.innerHTML='';draw();return;}
  v.style.opacity=0;setTimeout(draw,90);
}
function handleGlobalSearch(value){if(PAGE==='library'){LIB.q=value;const local=document.getElementById('libSearch');if(local)local.value=value;refreshLibraryDynamic();}}
function toggleSidebar(){ document.getElementById('app').classList.toggle('collapsed'); }
function segPick(btn){ [...btn.parentNode.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }

function toast(title, sub){
  const w=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`<span style="color:var(--ok);flex:0 0 auto">${I.check}</span><div>${title}${sub?`<span class="tsub">${sub}</span>`:''}</div>`;
  w.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),220)},2600);
}

setRole('admin');
</script>
