<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerodynamiks Academy — Dashboard Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AERODYNAMIKS ACADEMY — DESIGN TOKENS
   Brand palette D-20, sourced from aerodynamiks.aero
   ============================================================ */
:root{
  /* Brand */
  --brand:#E31E24;          /* primary action ONLY - never a status colour */
  --brand-700:#B8171C;
  --brand-050:#FDF1F1;
  --gold:#F0A830;
  --gold-050:#FFF8EA;
  --gold-200:#F7DFAE;
  --cream:#FCE8A8;
  --ink:#241D12;

  /* Warm dark - replaces the old navy. No blue anywhere in the palette. */
  --navy:#2E2617;
  --navy-700:#453A24;
  --navy-050:#FBF5E8;       /* warm tint used for hovers, segments, chips */

  /* Ochre wash used for the sidebar and highlighted surfaces */
  --wash-1:rgba(240,168,48,.22);
  --wash-2:rgba(240,168,48,.10);
  --wash-hover:rgba(240,168,48,.16);
  --wash-active:rgba(240,168,48,.32);
  --wash-line:rgba(184,148,66,.28);

  /* Status scale - separate from brand red, and free of blue */
  --ok:#0F7A45;      --ok-bg:#E9F6EF;
  --warn:#B26A00;    --warn-bg:#FDF3E3;
  --late:#8E1B2E;    --late-bg:#FBECEE;   /* deeper crimson, distinct from brand */
  --idle:#6B6153;    --idle-bg:#F3EFE6;
  --info:#7A4A2B;    --info-bg:#FAEFE6;   /* terracotta, was blue */

  /* Surfaces */
  --bg:#FAF7F0;
  --card:#FFFFFF;
  --line:#EAE3D4;
  --line-soft:#F3EDE1;
  --text:#2A2318;
  --text-2:#6B6153;
  --text-3:#9A917E;

  /* Type scale 12/14/16/20/24/30/36 */
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:24px; --t-2xl:30px; --t-3xl:36px;

  /* Space (8pt) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-full:999px;
  --shadow-1:0 1px 2px rgba(16,27,61,.05), 0 1px 3px rgba(16,27,61,.04);
  --shadow-2:0 4px 12px rgba(16,27,61,.07), 0 2px 4px rgba(16,27,61,.04);
  --shadow-3:0 12px 32px rgba(16,27,61,.12);
  --sidebar-w:268px;
  --sidebar-w-collapsed:78px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text);
  font-size:var(--t-sm); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;color:var(--navy);letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#DCD2BE;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#C9BDA2}
::-webkit-scrollbar-track{background:transparent}

/* ============================== SHELL ============================== */
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:linear-gradient(180deg,var(--wash-1),var(--wash-2)),#FFFCF4;
  color:var(--navy);border-right:1px solid var(--wash-line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  transition:width .22s ease, flex-basis .22s ease;
  z-index:40;
}
.app.collapsed .sidebar{width:var(--sidebar-w-collapsed);flex-basis:var(--sidebar-w-collapsed)}
.sb-head{padding:18px 16px 14px;display:flex;align-items:center;gap:11px;min-height:82px}
.sb-logo{display:flex;align-items:center;gap:11px;overflow:hidden}
.sb-mark{flex:0 0 auto}
.sb-word{display:flex;flex-direction:column;line-height:1.05;white-space:nowrap}
.sb-word .n1{font-family:'Inter',sans-serif;font-weight:800;font-size:15px;letter-spacing:.09em;color:var(--brand)}
.sb-word .n2{font-size:9.5px;letter-spacing:.26em;color:#B5820F;font-weight:700;text-transform:uppercase;margin-top:3px}
.app.collapsed .sb-word{display:none}
.app.collapsed .sb-head{justify-content:center;padding-left:0;padding-right:0}

.sb-toggle{
  margin-left:auto;width:28px;height:28px;border-radius:8px;
  display:grid;place-items:center;color:#8A7642;
  background:rgba(240,168,48,.20);transition:.15s;
}
.sb-toggle:hover{background:rgba(240,168,48,.34);color:var(--navy)}
.app.collapsed .sb-toggle{display:none}

.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 12px 12px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(184,148,66,.32);border-color:transparent}
.sb-group{margin-top:18px}
.sb-group:first-child{margin-top:4px}
.sb-label{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#A08F63;font-weight:700;padding:0 12px 8px;white-space:nowrap;
}
.app.collapsed .sb-label{opacity:0;height:8px;padding:0;overflow:hidden}
.sb-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;color:#6A5D40;
  font-size:var(--t-sm);font-weight:500;white-space:nowrap;
  position:relative;transition:.15s;width:100%;text-align:left;margin-bottom:2px;
}
.sb-item svg{flex:0 0 18px;opacity:.9}
.sb-item:hover{background:var(--wash-hover);color:var(--navy)}
.sb-item.active{background:var(--wash-active);color:var(--navy);font-weight:700}
.sb-item.active svg{opacity:1;color:var(--brand)}
.sb-item.active::before{
  content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;background:var(--brand);border-radius:0 3px 3px 0;
}
.sb-item .txt{overflow:hidden}
.app.collapsed .sb-item .txt,.app.collapsed .sb-item .pill{display:none}
.app.collapsed .sb-item{justify-content:center;padding:11px 0}
.sb-item .pill{
  margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:99px;line-height:1.5;
}

.sb-foot{border-top:1px solid var(--wash-line);padding:12px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;width:100%;text-align:left}
.sb-user:hover{background:var(--wash-hover)}
.sb-user .av{
  width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#B8171C);
  color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:0 0 34px;
}
.sb-user .meta{overflow:hidden;white-space:nowrap}
.sb-user .meta b{display:block;font-size:13px;font-weight:700;color:var(--navy);text-overflow:ellipsis;overflow:hidden}
.sb-user .meta span{font-size:11px;color:#8A7C5C}
.app.collapsed .sb-user .meta,.app.collapsed .sb-user .chev{display:none}
.app.collapsed .sb-user{justify-content:center}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:30;background:rgba(250,247,240,.88);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:14px 28px;display:flex;align-items:center;gap:16px;
}
.expand-btn{display:none;width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);place-items:center;color:var(--text-2)}
.app.collapsed .expand-btn{display:grid}
.crumb{font-size:var(--t-xs);color:var(--text-3);font-weight:500;letter-spacing:.02em}
.crumb b{color:var(--text-2);font-weight:600}
.page-t{font-size:var(--t-lg);margin-top:1px}

.search{
  margin-left:auto;position:relative;width:270px;
}
.search input{
  width:100%;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);padding:0 12px 0 36px;font-size:var(--t-sm);color:var(--text);
  transition:.15s;
}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(16,27,61,.08)}
.search svg{position:absolute;left:11px;top:10px;color:var(--text-3)}

.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;color:var(--text-2);position:relative;transition:.15s;
}
.icon-btn:hover{border-color:#D5C9AE;color:var(--navy)}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:99px;background:var(--brand);border:2px solid var(--card)}

.demo-pill{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--warn);background:var(--warn-bg);border:1px solid #F0DFBE;
  padding:4px 9px;border-radius:99px;white-space:nowrap;
}

/* Role switcher */
.roleswitch{display:flex;background:var(--navy-050);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.roleswitch button{
  padding:7px 14px;border-radius:8px;font-size:var(--t-xs);font-weight:600;color:var(--text-2);
  display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.roleswitch button:hover{color:var(--navy)}
.roleswitch button.on{background:var(--card);color:var(--navy);box-shadow:var(--shadow-1)}
.roleswitch button.on svg{color:var(--brand)}

.content{padding:24px 28px 56px;max-width:1560px;width:100%}

/* ---------- Page header ---------- */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:var(--t-2xl);line-height:1.2}
.phead .sub{color:var(--text-2);font-size:var(--t-sm);margin-top:5px}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out 1s 2}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}

.btn{
  display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;
  font-size:var(--t-sm);font-weight:600;transition:.15s;white-space:nowrap;
}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(227,30,36,.3)}
.btn-primary:hover{background:var(--brand-700);box-shadow:0 4px 12px rgba(227,30,36,.28);transform:translateY(-1px)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--navy)}
.btn-ghost:hover{border-color:#D5C9AE;box-shadow:var(--shadow-1)}
.btn-sm{height:32px;padding:0 11px;font-size:var(--t-xs);border-radius:8px}

/* ---------- Filter bar ---------- */
.filters{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;margin-bottom:20px;box-shadow:var(--shadow-1);
}
.fl-label{font-size:var(--t-xs);color:var(--text-3);font-weight:600;display:flex;align-items:center;gap:6px;padding-right:2px}
.seg{display:flex;background:var(--navy-050);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:var(--t-xs);font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:var(--shadow-1)}
.sel{
  height:34px;border:1px solid var(--line);border-radius:9px;background:var(--card);
  padding:0 30px 0 11px;font-size:var(--t-xs);font-weight:600;color:var(--navy);
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235B6478' stroke-width='2.5' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;cursor:pointer;
}
.sel:hover{border-color:#D5C9AE}
.chip-applied{
  display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 11px;border-radius:99px;
  background:var(--navy-050);border:1px solid #EADFC6;color:var(--navy);font-size:var(--t-xs);font-weight:600;
}
.chip-applied button{width:18px;height:18px;border-radius:99px;display:grid;place-items:center;color:var(--text-2)}
.chip-applied button:hover{background:#EADFC6;color:var(--navy)}
.reset{margin-left:auto;font-size:var(--t-xs);font-weight:600;color:var(--brand);padding:6px 8px;border-radius:7px}
.reset:hover{background:var(--brand-050)}

/* ---------- Grid & cards ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
.c9{grid-column:span 9}.c12{grid-column:span 12}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);overflow:hidden;display:flex;flex-direction:column;
}
.card-h{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-soft)}
.card-h h3{font-size:var(--t-md);font-weight:700}
.card-h .hint{font-size:var(--t-xs);color:var(--text-3);margin-top:2px;font-family:'Inter',sans-serif}
.card-b{padding:18px;flex:1}
.card-b.tight{padding:12px 18px 18px}
.link{font-size:var(--t-xs);font-weight:600;color:var(--brand)}
.link:hover{text-decoration:underline}

/* ---------- KPI ---------- */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-1);position:relative;overflow:hidden;transition:.18s}
.kpi:hover{box-shadow:var(--shadow-2);transform:translateY(-2px)}
.kpi .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.kpi .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px}
.kpi .lab{font-size:var(--t-xs);color:var(--text-2);font-weight:600;letter-spacing:.01em}
.kpi .val{font-family:'Playfair Display',Georgia,serif;font-size:var(--t-2xl);font-weight:700;color:var(--navy);line-height:1.1;margin-top:10px;letter-spacing:-.02em}
.kpi .val small{font-size:15px;font-weight:600;color:var(--text-2);font-family:'Inter',sans-serif;margin-left:2px}
.kpi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:700;padding:3px 7px;border-radius:99px}
.delta.up{color:var(--ok);background:var(--ok-bg)}
.delta.down{color:var(--late);background:var(--late-bg)}
.delta.flat{color:var(--idle);background:var(--idle-bg)}
.kpi .vs{font-size:11px;color:var(--text-3)}

/* ---------- Status chips (icon + text, never colour alone) ---------- */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px 3px 7px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.st svg{flex:0 0 12px}
.st-ok{color:var(--ok);background:var(--ok-bg)}
.st-warn{color:var(--warn);background:var(--warn-bg)}
.st-late{color:var(--late);background:var(--late-bg)}
.st-idle{color:var(--idle);background:var(--idle-bg)}
.st-info{color:var(--info);background:var(--info-bg)}

/* ---------- Progress ---------- */
.bar{height:9px;border-radius:99px;background:#F0EADC;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar.thick{height:11px}
.bar .thresh{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy);opacity:.55;border-radius:2px}
.barline{display:flex;align-items:center;gap:10px}
.barline .n{font-size:var(--t-xs);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  font-weight:700;padding:0 14px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;
}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover{background:var(--navy-050)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy)}
.tbl .nm{font-weight:600;color:var(--navy);font-size:var(--t-sm)}
.tbl .sub{font-size:var(--t-xs);color:var(--text-3);margin-top:2px}
.rowact{opacity:0;transition:.15s}
.tbl tbody tr:hover .rowact,.tbl tbody tr:focus-within .rowact{opacity:1}
.tbl-wrap{overflow-x:auto}

.av-sm{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-size:11px;font-weight:700;flex:0 0 32px;letter-spacing:.02em;
}
.who{display:flex;align-items:center;gap:10px}

/* ---------- Lists / feed ---------- */
.feed{display:flex;flex-direction:column}
.feed li{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line-soft);list-style:none}
.feed li:last-child{border-bottom:none;padding-bottom:0}
.feed li:first-child{padding-top:0}
.feed .fic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;margin-top:1px}
.feed .ftxt{font-size:var(--t-sm);color:var(--text);line-height:1.45}
.feed .ftxt b{font-weight:600;color:var(--navy)}
.feed .ftime{font-size:11px;color:var(--text-3);margin-top:3px;font-variant-numeric:tabular-nums}

.alerts{display:flex;flex-direction:column;gap:10px}
.alert{
  display:flex;gap:12px;padding:13px;border-radius:var(--r);border:1px solid;align-items:flex-start;
  transition:.15s;
}
.alert:hover{transform:translateX(2px)}
.alert.a-late{background:var(--late-bg);border-color:#EFD3D8}
.alert.a-warn{background:var(--warn-bg);border-color:#F0DFBE}
.alert.a-info{background:var(--info-bg);border-color:#EDDCCC}
.alert .aic{flex:0 0 20px;margin-top:1px}
.alert .atitle{font-size:var(--t-sm);font-weight:700;color:var(--navy)}
.alert .adesc{font-size:var(--t-xs);color:var(--text-2);margin-top:3px;line-height:1.5}
.alert .aact{margin-top:8px;display:flex;gap:8px}
.mini-btn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;background:var(--card);border:1px solid var(--line);color:var(--navy);transition:.15s}
.mini-btn:hover{border-color:#D5C9AE;box-shadow:var(--shadow-1)}
.mini-btn.solid{background:var(--brand);color:#fff;border-color:var(--brand)}
.mini-btn.solid:hover{background:var(--brand-700)}

/* ---------- Hero (instructor / student) ---------- */
.hero{
  background:linear-gradient(118deg,#FFF8E9 0%,#FDEFD2 54%,#FAE5B6 100%);
  border:1px solid #F1DFB4;
  border-radius:var(--r-lg);padding:24px;color:var(--navy);position:relative;overflow:hidden;
  box-shadow:var(--shadow-2);
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:330px;height:330px;border-radius:50%;
  background:radial-gradient(circle,rgba(227,30,36,.10),transparent 68%);
}
.hero::before{
  content:"";position:absolute;right:8%;bottom:-40%;width:420px;height:420px;border-radius:50%;
  border:1px solid rgba(184,148,66,.20);
}
.hero .in{position:relative;z-index:1}
.hero h2{color:var(--navy);font-size:var(--t-xl)}
.hero .lede{color:#7A6A45;font-size:var(--t-sm);margin-top:6px;max-width:60ch}
.hero-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hero-stats{display:flex;gap:12px;flex-wrap:wrap}
.hstat{background:rgba(255,255,255,.66);border:1px solid rgba(184,148,66,.30);border-radius:var(--r);padding:11px 15px;min-width:112px;backdrop-filter:blur(4px)}
.hstat .l{font-size:11px;color:#93803F;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.hstat .v{font-family:'Playfair Display',serif;font-size:var(--t-xl);font-weight:700;margin-top:3px;line-height:1.1;color:var(--navy)}
.hstat .v small{font-size:13px;font-family:'Inter',sans-serif;font-weight:600;color:#7A6A45}

.class-strip{display:flex;flex-direction:column;gap:10px;margin-top:18px;position:relative;z-index:1}
.class-row{
  display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.62);
  border:1px solid rgba(184,148,66,.28);border-radius:var(--r);padding:12px 14px;transition:.15s;
}
.class-row:hover{background:rgba(255,255,255,.9);border-color:rgba(184,148,66,.45)}
.class-row .time{
  font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--t-sm);color:#8A5A00;
  background:rgba(240,168,48,.24);border:1px solid rgba(184,148,66,.38);
  padding:6px 10px;border-radius:8px;flex:0 0 auto;
}
.class-row .cinfo b{display:block;font-size:var(--t-sm);font-weight:700;color:var(--navy)}
.class-row .cinfo span{font-size:var(--t-xs);color:#7A6A48}
.class-row .cact{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-gold{background:var(--brand);color:#fff;font-weight:700}
.btn-gold:hover{background:var(--brand-700)}
.btn-onhero{background:rgba(255,255,255,.8);border:1px solid rgba(184,148,66,.38);color:var(--navy)}
.btn-onhero:hover{background:#fff}

/* ---------- Ring ---------- */
.ring-wrap{position:relative;display:grid;place-items:center;flex:0 0 auto}
.ring-txt{position:absolute;text-align:center;line-height:1.1}
.ring-txt b{font-family:'Playfair Display',serif;font-size:var(--t-xl);color:var(--navy);display:block}
.ring-txt span{font-size:10px;color:var(--text-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* ---------- Subject rows ---------- */
.subj{display:flex;flex-direction:column;gap:16px}
.subj-row{display:flex;flex-direction:column;gap:8px}
.subj-top{display:flex;align-items:center;gap:10px}
.subj-dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.subj-name{font-size:var(--t-sm);font-weight:600;color:var(--navy);letter-spacing:.01em}
.subj-meta{margin-left:auto;font-size:var(--t-xs);color:var(--text-3);font-variant-numeric:tabular-nums}
.subj-meta b{color:var(--navy);font-weight:700}

/* ---------- Topic / library items ---------- */
.tlist{display:flex;flex-direction:column}
.titem{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.titem:last-child{border-bottom:none;padding-bottom:0}
.titem:first-child{padding-top:0}
.titem .tmain b{font-size:var(--t-sm);font-weight:600;color:var(--navy);display:block;line-height:1.35}
.titem .tmeta{font-size:var(--t-xs);color:var(--text-3);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.by{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--text-2)}
.by .av-xs{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:700}
.sep{width:3px;height:3px;border-radius:99px;background:#CFC3A8;display:inline-block}

/* ---------- Legend ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-xs);color:var(--text-2);font-weight:500}
.legend i{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .swl{width:14px;height:0;border-top:2px dashed #B8AA8A}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;top:18px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{
  display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--ok);border-radius:var(--r);padding:13px 16px;box-shadow:var(--shadow-3);
  font-size:var(--t-sm);font-weight:600;color:var(--navy);min-width:270px;
  animation:slidein .28s cubic-bezier(.2,.8,.3,1);
}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast.out{animation:slideout .22s forwards}
@keyframes slideout{to{opacity:0;transform:translateX(24px)}}
.toast .tsub{display:block;font-weight:400;font-size:var(--t-xs);color:var(--text-2);margin-top:2px}

/* ---------- Misc ---------- */
.divider{height:1px;background:var(--line-soft);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:var(--t-sm)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--text-2)}
.kv b{color:var(--navy);font-weight:600;text-align:right}
.hidden{display:none !important}
.mono{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}

@media (max-width:1360px){

  .content{padding:18px 16px 48px}

  .search{display:none}
}

/* =====================================================================
   SVG CHART HELPERS
   ===================================================================== */
function sparkline(vals, colour, w=88, h=30){
  const mx = Math.max(...vals), mn = Math.min(...vals), rg = (mx-mn)||1;
  const pts = vals.map((v,i)=>[i/(vals.length-1)*w, h-2 - ((v-mn)/rg)*(h-6)]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = d+` L${w} ${h} L0 ${h} Z`;
  const id = 'g'+Math.random().toString(36).slice(2,8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${colour}" stop-opacity=".22"/><stop offset="100%" stop-color="${colour}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${d}" stroke="${colour}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.6" fill="${colour}"/>
  </svg>`;
}

/* Grouped bars: current week vs previous week */
function hoursChart(cur, prev, labels, w=680, h=230){
  const pad = {l:36, r:8, t:14, b:26};
  const cw = w-pad.l-pad.r, chh = h-pad.t-pad.b;
  const max = Math.ceil(Math.max(...cur, ...prev))+1;
  const step = cw/labels.length;
  const bw = Math.min(20, step*0.30);
  let g='';
  for(let i=0;i<=max;i++){
    const y = pad.t + chh - (i/max)*chh;
    g += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#F3EDE1" stroke-width="1"/>
          <text x="${pad.l-9}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#9A917E" font-family="Inter">${i}h</text>`;
  }
  let bars='';
  labels.forEach((lb,i)=>{
    const cx = pad.l + step*i + step/2;
    const hC = (cur[i]/max)*chh, hP = (prev[i]/max)*chh;
    bars += `<rect x="${(cx-bw-2).toFixed(1)}" y="${(pad.t+chh-hP).toFixed(1)}" width="${bw}" height="${Math.max(hP,1).toFixed(1)}" rx="3" fill="#EADFC6"/>`;
    bars += `<rect x="${(cx+2).toFixed(1)}" y="${(pad.t+chh-hC).toFixed(1)}" width="${bw}" height="${Math.max(hC,1).toFixed(1)}" rx="3" fill="#E31E24" opacity=".92"/>`;
    if(cur[i]>0) bars += `<text x="${(cx+2+bw/2).toFixed(1)}" y="${(pad.t+chh-hC-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#4A3B1E" font-family="Inter">${cur[i].toFixed(1)}</text>`;
    bars += `<text x="${cx.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#6B6153" font-weight="600" font-family="Inter">${lb}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Teaching hours per day, this week versus last week">${g}
    <line x1="${pad.l}" y1="${pad.t+chh}" x2="${w-pad.r}" y2="${pad.t+chh}" stroke="#DFD5C0" stroke-width="1.2"/>${bars}</svg>`;
}

/* Attendance line with dotted comparison */
function lineChart(vals, w=560, h=170){
  const pad={l:34,r:10,t:14,b:24}, cw=w-pad.l-pad.r, chh=h-pad.t-pad.b;
  const mn=70, mx=100;
  const P = vals.map((v,i)=>[pad.l+ i/(vals.length-1)*cw, pad.t+chh-((v-mn)/(mx-mn))*chh]);
  const d = P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let g='';
  [70,80,90,100].forEach(v=>{
    const y=pad.t+chh-((v-mn)/(mx-mn))*chh;
    g+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#F3EDE1"/>
        <text x="${pad.l-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#9A917E" font-family="Inter">${v}%</text>`;
  });
  // 75% DGCA-style threshold
  const ty = pad.t+chh-((75-mn)/(mx-mn))*chh;
  g += `<line x1="${pad.l}" y1="${ty.toFixed(1)}" x2="${w-pad.r}" y2="${ty.toFixed(1)}" stroke="#8E1B2E" stroke-width="1.4" stroke-dasharray="5 4" opacity=".65"/>
        <text x="${w-pad.r}" y="${(ty-6).toFixed(1)}" text-anchor="end" font-size="9.5" font-weight="700" fill="#8E1B2E" font-family="Inter">75% minimum</text>`;
  const pts = P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="#fff" stroke="#4A3B1E" stroke-width="2"/>`).join('');
  const lab = P.map((p,i)=>`<text x="${p[0].toFixed(1)}" y="${h-7}" text-anchor="middle" font-size="10" fill="#9A917E" font-family="Inter">W${i+1}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Average attendance over the last eight weeks">${g}
    <path d="${d} L${P[P.length-1][0].toFixed(1)} ${pad.t+chh} L${pad.l} ${pad.t+chh} Z" fill="#4A3B1E" opacity=".06"/>
    <path d="${d}" stroke="#4A3B1E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${pts}${lab}</svg>`;
}

function ring(pct, size=104, stroke=10, colour="#E31E24", label="Complete"){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" role="img" aria-label="${pct} percent ${label}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#F0EADC" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${colour}" stroke-width="${stroke}" fill="none"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}"
        stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
    <div class="ring-txt"><b>${pct}%</b><span>${label}</span></div>
  </div>`;
}

    <circle cx="15" cy="15" r="${r}" stroke="${colour}" stroke-width="${st}" fill="none" stroke-dasharray="${c.toFixed(1)}"
      stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}" stroke-linecap="round" transform="rotate(-90 15 15)"/></svg>`;
}

/* ---- Admin filter state + derived figures ---- */
const AF = { range:"d30", prog:"all", batch:"all", instr:"all" };
const syll = b => Math.round(b.subjects.reduce((s,x)=>s+x.d,0)/b.subjects.reduce((s,x)=>s+x.t,0)*100);

function computeAdmin(){
  const rk = rkey(AF.range);

  let batches = BATCHES.filter(b => AF.prog==="all" || b.prog===AF.prog);
  if(AF.batch!=="all") batches = batches.filter(b=>b.id===AF.batch);
  if(AF.instr!=="all") batches = batches.filter(b=>INSTR_LOAD.some(l=>l.i===AF.instr && l.b===b.id));

  const ids = batches.map(b=>b.id);
  let load = INSTR_LOAD.filter(l=>ids.includes(l.b));
  if(AF.instr!=="all") load = load.filter(l=>l.i===AF.instr);

  // range scaling, derived from each batch's own totals so nothing drifts
  const hS = b => b.hours[rk]/b.hours.d30;
  const rS = b => b.reports[rk]/b.reports.d30;

  const hours   = AF.instr==="all" ? batches.reduce((s,b)=>s+b.hours[rk],0)
                                   : load.reduce((s,l)=>s+l.h*hS(byId(l.b)),0);
  const reports = AF.instr==="all" ? batches.reduce((s,b)=>s+b.reports[rk],0)
                                   : Math.round(load.reduce((s,l)=>s+l.c*rS(byId(l.b)),0));
  const cadets  = batches.reduce((s,b)=>s+b.cadets,0);
  const att     = cadets ? Math.round(batches.reduce((s,b)=>s+b.att*b.cadets,0)/cadets) : 0;
  const done    = batches.reduce((s,b)=>s+b.subjects.reduce((a,x)=>a+x.d,0),0);
  const total   = batches.reduce((s,b)=>s+b.subjects.reduce((a,x)=>a+x.t,0),0);
  const comp    = total ? Math.round(done/total*100) : 0;

  // subjects aggregated by name across the selected batches
  const map = new Map();
  batches.forEach(b=>b.subjects.forEach(x=>{
    const e = map.get(x.n) || {n:x.n, c:x.c, d:0, t:0};
    e.d+=x.d; e.t+=x.t; map.set(x.n, e);
  }));
  const subjects = [...map.values()].sort((a,b)=>(b.d/b.t)-(a.d/a.t));

  // instructor rows
  const iMap = new Map();
  load.forEach(l=>{
    const who = INSTRUCTORS.find(t=>t.i===l.i);
    const e = iMap.get(l.i) || {n:who.n, i:l.i, c:who.c, hours:0, classes:0, batches:new Set()};
    e.hours += l.h*hS(byId(l.b));
    e.classes += Math.round(l.c*rS(byId(l.b)));
    e.batches.add(l.b); iMap.set(l.i, e);
  });
  const instr = [...iMap.values()].sort((a,b)=>b.hours-a.hours);
  const instrMax = instr.reduce((s,x)=>s+x.hours,0) || 1;

  const alerts = ALERTS.filter(a=>ids.includes(a.b) && (AF.instr==="all"||a.i===AF.instr));
  const feed   = FEED.filter(f=>ids.includes(f.b) && (AF.instr==="all"||f.i===AF.instr));

  // attendance trend ending on the computed average
  const trend = [-6,-4,-5,-2,-3,0,-1,0].map(d=>Math.max(70,Math.min(100, att+d)));
  const share = BATCHES.reduce((s,b)=>s+b.hours.d30,0);
  const wk = (AF.instr==="all" ? batches.reduce((s,b)=>s+b.hours.d30,0)
                               : load.reduce((s,l)=>s+l.h,0)) / share;

  return {batches, load, hours, reports, cadets, att, done, total, comp,
          subjects, instr, instrMax, alerts, feed, trend, wk, rk};
}

const myCadets = () => CADETS.filter(c=>MY_BATCHES.includes(c.b));

function cadetRow(c){
  return `<tr>
    <td><div class="who"><span class="av-sm" style="background:${c.c}18;color:${c.c}">${c.i}</span><span class="nm">${c.n}</span></div></td>

      ${miniRing(c.prog, c.prog>=60?'#0F7A45':c.prog>=40?'#F0A830':'#8E1B2E')}
      <span class="num">${c.prog}%</span></div></td>
    <td>${c.dueState==='late'
        ? `<span class="st st-late">${I.alert} Overdue ${c.due}</span>`
        : c.dueState==='warn'
        ? `<span class="st st-warn">${I.clockSm} ${c.due}</span>`
        : `<span class="sub" style="color:var(--text-2);font-weight:600">${c.due} 2026</span>`}</td>
    <td>${attChip(c.att)}</td>
    <td style="text-align:right"><span class="rowact" style="display:inline-flex;gap:6px">
      <button class="mini-btn" onclick="toast('Reminder sent','${c.n} has been notified.')">${I.bell} Remind</button>
      <button class="mini-btn" title="View cadet">${I.eye}</button>
    </span></td></tr>`;
}

const STATUS_LABEL = {low:"Below 75% attendance",watch:"Watch (75–84%)",ontrack:"On track (85%+)",overdue:"Overdue checkpoint"};

function applyStudentFilter(){
  const body=document.getElementById('stuBody'); if(!body) return;
  const q=(document.getElementById('fSearch').value||'').trim().toLowerCase();
  const b=document.getElementById('fBatch').value;
  const s=document.getElementById('fStatus').value;
  const sort=document.getElementById('fSort').value;
  const all=myCadets();
  let list=all.slice();

  if(q) list=list.filter(c=>c.n.toLowerCase().includes(q));
  if(b!=='all') list=list.filter(c=>c.b===b);
  if(s==='low')     list=list.filter(c=>c.att<75);
  if(s==='watch')   list=list.filter(c=>c.att>=75&&c.att<85);
  if(s==='ontrack') list=list.filter(c=>c.att>=85);
  if(s==='overdue') list=list.filter(c=>c.dueState==='late');

  if(sort==='att')       list.sort((x,y)=>x.att-y.att);
  else if(sort==='prog') list.sort((x,y)=>x.prog-y.prog);
  else                   list.sort((x,y)=>x.n.localeCompare(y.n));

  body.innerHTML = list.length
    ? list.map(cadetRow).join('')
    : `<tr><td colspan="7" style="padding:38px 14px;text-align:center">
         <div style="font-size:var(--t-md);font-weight:700;color:var(--navy);font-family:'Playfair Display',serif">No cadets match these filters</div>
         <div style="font-size:var(--t-xs);color:var(--text-2);margin-top:6px">Try widening the batch or status filter.</div>
         <button class="mini-btn" style="margin-top:12px" onclick="resetStudentFilter()">Reset filters</button>
       </td></tr>`;

  document.getElementById('stuCount').textContent =
    `Showing ${list.length} of ${all.length} cadets across ${b==='all'?'2 batches':'1 batch'}`;

  // applied-filter chips
  const chips=[];
  if(q) chips.push(['Search: “'+q+'”', "document.getElementById('fSearch').value='';applyStudentFilter()"]);
  if(b!=='all') chips.push([b, "document.getElementById('fBatch').value='all';applyStudentFilter()"]);
  if(s!=='all') chips.push([STATUS_LABEL[s], "document.getElementById('fStatus').value='all';applyStudentFilter()"]);
  document.getElementById('stuChips').innerHTML = chips.map(([t,fn])=>
    `<span class="chip-applied">${t}<button aria-label="Remove filter" onclick="${fn}">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button></span>`).join('');
}

function resetStudentFilter(){
  document.getElementById('fSearch').value='';
  document.getElementById('fBatch').value='all';
  document.getElementById('fStatus').value='all';
  document.getElementById('fSort').value='name';
  applyStudentFilter();
  toast('Filters reset','Showing all 12 cadets in your batches.');
}

function remindFlagged(){
  const flagged=myCadets().filter(c=>c.att<75||c.dueState==='late');
  toast(`${flagged.length} reminders sent`, flagged.map(c=>c.n.split(' ')[0]).join(', ')+' notified.');
}

/* =====================================================================
   FILTER BAR
   ===================================================================== */
function emptyRow(cols, msg){
  return `<tr><td colspan="${cols}" style="padding:34px 14px;text-align:center">
    <div style="font-family:'Playfair Display',serif;font-size:var(--t-md);font-weight:700;color:var(--navy)">${msg}</div>
    <div style="font-size:var(--t-xs);color:var(--text-2);margin-top:6px">Try widening the programme, batch or instructor filter.</div>
    <button class="mini-btn" style="margin-top:12px" onclick="resetAF()">Reset filters</button></td></tr>`;
}

function filterBar(){
  const opts = (list, cur, allLabel) =>
    `<option value="all"${cur==="all"?" selected":""}>${allLabel}</option>` +
    list.map(o=>`<option value="${o.v}"${cur===o.v?" selected":""}>${o.l}</option>`).join('');

  // batch list respects the programme filter (cascading)
  const bList = BATCHES.filter(b=>AF.prog==="all"||b.prog===AF.prog).map(b=>({v:b.id,l:b.name}));

  const chips=[];
  if(AF.range!=="d30") chips.push([RANGE_LABEL[AF.range], "range"]);
  if(AF.prog!=="all")  chips.push([AF.prog, "prog"]);
  if(AF.batch!=="all") chips.push([byId(AF.batch).name, "batch"]);
  if(AF.instr!=="all") chips.push([INSTRUCTORS.find(t=>t.i===AF.instr).n, "instr"]);

  return `
  <div class="filters">
    <span class="fl-label">${I.filter} Filters</span>
    <div class="seg" role="group" aria-label="Date range">
      ${Object.entries(RANGES).map(([k,l])=>
        `<button class="${AF.range===k?'on':''}" onclick="setAF('range','${k}')">${l}</button>`).join('')}
    </div>
    <select class="sel" aria-label="Programme" onchange="setAF('prog',this.value)">
      ${opts(PROGRAMMES.map(p=>({v:p,l:p})), AF.prog, "All programmes")}
    </select>
    <select class="sel" aria-label="Batch" onchange="setAF('batch',this.value)">
      ${opts(bList, AF.batch, "All batches")}
    </select>
    <select class="sel" aria-label="Instructor" onchange="setAF('instr',this.value)">
      ${opts(INSTRUCTORS.map(t=>({v:t.i,l:t.n})), AF.instr, "All instructors")}
    </select>
    ${chips.map(([t,k])=>`<span class="chip-applied">${t}
      <button aria-label="Remove ${t} filter" onclick="setAF('${k}','${k==='range'?'d30':'all'}')">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button></span>`).join('')}
    ${chips.length?`<button class="reset" onclick="resetAF()">Reset all</button>`:''}
  </div>`;
}

/* =====================================================================
   BEHAVIOUR
   ===================================================================== */
let ROLE='admin';
function setRole(r){
  ROLE=r;
  ['admin','instructor','student'].forEach(x=>document.getElementById('rb-'+x).classList.toggle('on',x===r));
  renderNav(r);
  const v=document.getElementById('view');
  v.style.opacity=0;
  setTimeout(()=>{
    v.innerHTML = r==='admin' ? adminView() : r==='instructor' ? instructorView() : studentView();
    if(r==='instructor') applyStudentFilter();
    document.getElementById('pageTitle').textContent='Dashboard';
    v.style.transition='opacity .22s ease'; v.style.opacity=1;
    window.scrollTo({top:0,behavior:'smooth'});
  },110);
}
function toggleSidebar(){ document.getElementById('app').classList.toggle('collapsed'); }
function segPick(btn){ [...btn.parentNode.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }

function toast(title, sub){
  const w=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`<span style="color:var(--ok);flex:0 0 auto">${I.check}</span><div>${title}${sub?`<span class="tsub">${sub}</span>`:''}</div>`;
  w.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),220)},2600);
}

setRole('admin');
</script>
